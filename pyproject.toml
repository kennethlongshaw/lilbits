[project]
name = "lilbits"
version = "0.1.0"
description = "Primitives for small, lean AI models: low-bit linears, recurrent mixers, packing, decision readouts, training and measurement"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.9", "lightning>=2.5", "jsonargparse[signatures]>=4.32"]

[project.optional-dependencies]
gpu = ["helion>=1.6"]
tune = ["optuna>=4.0"]
plot = ["matplotlib>=3.8"]

[project.scripts]
lb-train = "lilbits.training.train:main"
lb-tune = "lilbits.training.tune:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lilbits"]

[tool.pytest.ini_options]
testpaths = ["tests"]
