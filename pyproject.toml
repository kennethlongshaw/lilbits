[project]
name = "lilbits"
version = "0.1.0"
description = "Primitives for small, lean AI models: low-bit linears, recurrent mixers, packing, decision readouts, training and measurement"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.9", "lightning>=2.5", "jsonargparse[signatures]>=4.32"]

[project.optional-dependencies]
gpu = ["helion>=1.6"]
tune = ["optuna>=4.0"]
plot = ["matplotlib>=3.8"]

[project.scripts]
lb-train = "lilbits.training.train:main"
lb-tune = "lilbits.training.tune:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lilbits"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
    "E731",    # lambda assignment: used for short local helpers
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode (×, ±, → in docs and tables are intended)
    "E741",    # single-letter names follow the papers' notation (l, O)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
"benchmarks/*" = ["B023"]  # timing lambdas are called immediately inside the loop
"src/lilbits/training/train.py" = ["B008"]  # dataclass defaults are the jsonargparse CLI pattern

[tool.ty.environment]
python-version = "3.11"
