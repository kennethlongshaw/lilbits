[package]
name = "lilbits_fused"
version = "0.1.0"
edition = "2024"
description = "Fused CPU inference for lilbits LeanLM (GDN byte LM): AVX-512, AVX2, AVX-VNNI, NEON and scalar kernels via fearless_simd"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fearless_simd = { version = "1.3.0", features = ["force_support_fallback"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
