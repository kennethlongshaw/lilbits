[package]
name = "lilbits_fused"
version = "0.1.0"
edition = "2024"
description = "Fused CPU inference for lilbits LeanLM (GDN byte LM): same C ABI as fused_kernel.c, SIMD via fearless_simd"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fearless_simd = "1.3.0"
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
